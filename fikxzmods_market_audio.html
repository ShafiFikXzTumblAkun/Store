<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FikXzMods - Market</title>
  <meta name="theme-color" content="#4a148c" />
  <meta name="description" content="FikXzMods Market - Panel, Jasa dan Produk terpercaya." />
  <link rel="icon" href="https://files.catbox.moe/xfxo77.jpg" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    :root {
      --bg: #0f0f11;
      --panel: #18181b;
      --text: #e5e5e5;
      --muted: #a0a0a0;
      --primary: #c084fc;
      --accent: #7c3aed;
      --hover: rgba(124, 58, 237, 0.15);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      background: var(--bg) url('https://files.catbox.moe/bwsb2e.jpg') center/cover fixed no-repeat;
      color: var(--text);
    }
    .wrapper {
      max-width: 1080px;
      margin: auto;
      padding: 60px 20px;
      backdrop-filter: blur(10px);
    }
    header {
      text-align: center;
      margin-bottom: 50px;
    }
    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 1px;
    }
    .subtitle {
      font-size: 1rem;
      color: var(--muted);
      margin-top: 10px;
    }
    section {
      background-color: var(--panel);
      border-radius: 14px;
      padding: 28px;
      margin-bottom: 40px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateX(-40px);
      transition: all 0.7s ease-out;
    }
    section.visible {
      opacity: 1;
      transform: translateX(0);
    }
    section h2 {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 20px;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 6px;
    }
    .list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .list-card {
      background: var(--hover);
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease-in-out;
      transform: scale(1);
    }
    .list-card:hover {
      background-color: rgba(124, 58, 237, 0.25);
      transform: scale(1.03);
    }
    .list-card .title {
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--text);
      margin-bottom: 6px;
    }
    .list-card .price {
      font-size: 0.95rem;
      color: var(--muted);
    }
    .bonus-list li {
      background-color: rgba(255, 255, 255, 0.04);
      margin-bottom: 10px;
      padding: 12px 18px;
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bonus-list li::before {
      content: '✔';
      color: var(--primary);
    }
    .testimonial-link {
      color: var(--primary);
      font-weight: 600;
      text-align: center;
      display: block;
      margin-top: 20px;
      transition: all 0.3s ease-in-out;
    }
    .testimonial-link:hover {
      transform: scale(1.05);
      text-decoration: underline;
    }
    .payment-methods {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .payment-method {
      background-color: #252525;
      border-radius: 12px;
      padding: 16px;
      width: 200px;
      text-align: center;
      transition: 0.3s ease-in-out;
    }
    .payment-method:hover {
      transform: translateY(-5px);
    }
    .payment-method img {
      max-width: 100%;
      margin-bottom: 12px;
      border-radius: 6px;
    }
    .contact-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      margin-top: 30px;
    }
    .contact-btn {
      background-color: var(--accent);
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s ease;
    }
    .contact-btn:hover {
      background-color: #6d28d9;
      transform: scale(1.05);
    }
    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #888;
      margin-top: 40px;
    }
    #sound-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }
    #toggle-sound {
      background: var(--accent);
      border: none;
      color: white;
      padding: 12px;
      border-radius: 50%;
      font-size: 18px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: 0.3s;
    }
  </style>
</head>
<body>
  <main class="wrapper">
    <header>
      <h1>FikXzMods Marketplace</h1>
      <p class="subtitle">List Store dan Payment Aing</p>
    </header>
    <!-- Sections go here (you can paste them from previous content) -->
    <footer>
      <p>&copy; FikXzMods 2024 - 2025. All rights reserved.</p>
      <p>100% FikXzMods Amanah</p>
    </footer>
  </main>
  <audio id="mysound" src="https://files.catbox.moe/qtg2mj.mp3" preload="auto" loop></audio>
  <div id="sound-toggle">
    <button id="toggle-sound">🔊</button>
  </div>
  <script>
    document.querySelectorAll('section').forEach(sec => {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.1 });
      observer.observe(sec);
    });
    const audio = document.getElementById("mysound");
    const toggleBtn = document.getElementById("toggle-sound");
    window.addEventListener("DOMContentLoaded", () => {
      audio.play().catch(() => {
        document.body.addEventListener("click", () => {
          audio.play();
        }, { once: true });
      });
    });
    toggleBtn.addEventListener("click", () => {
      audio.muted = !audio.muted;
      toggleBtn.textContent = audio.muted ? "🔇" : "🔊";
    });
  </script>
</body>
</html>
